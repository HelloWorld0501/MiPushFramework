name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag label (e.g. v1.0.0-test)'
        required: false
        type: string
        default: 'v1.0.0-test'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      MAGISK_BUILD_TYPE: release
      MAGISK_IS_CI_BUILD: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set build timestamp
        run: echo "MAGISK_BUILD_TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Setup Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" ]]; then
            echo "::error::RELEASE_KEYSTORE secret is empty"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > release.jks
          test -s release.jks

      - name: Build Release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --warning-mode all :xmsf:assembleRelease :mipush:assembleGithubRelease -PbuildSplits=true -Pkotlin.incremental=false
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload MiPush Release APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipush-release-apks
          path: mipush/build/outputs/apk/github/release/**/*.apk
          if-no-files-found: ignore

      - name: Upload XMSF Release APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xmsf-release-apks
          path: xmsf/build/outputs/apk/**/release/**/*.apk
          if-no-files-found: ignore
